- name: parsing Ganeti version
  shell:
    cmd: awk -F ',' '$1 ~ /\[gnt_version_(major|minor)\]/ {print $2}' /tmp/{{ build_id }}/*/configure.ac | tr -d ' [])'
  register: gnt_version

- name: setting fact for Ganeti major/minor version
  set_fact:
    gnt_maj_v: gnt_version.stdout_lines[0]
    gnt_min_v: gnt_version.stdout_lines[1]
    gnt_ver: "{{ gnt_version.stdout_lines[0] }}.{{ gnt_version.stdout_lines[1] }}"

- name: "installing runtime dependencies for Ganeti 3.x"
  apt:
    name: "{{ ganeti_run_deps_general + ganeti_run_deps_python3 }}"
    state: "present"
  environment:
    LD_PRELOAD: /usr/lib/x86_64-linux-gnu/libeatmydata.so
  when: gnt_ver is version('3.1', '>=')

- name: "installing runtime dependencies for Ganeti 2.x"
  apt:
    name: "{{ ganeti_run_deps_general + ganeti_run_deps_python2 }}"
    state: "present"
  environment:
    LD_PRELOAD: /usr/lib/x86_64-linux-gnu/libeatmydata.so
  when: gnt_ver is version('3.0', '<')

- name: "installing runtime dependencies for Ganeti 3.0"
  apt:
    name: "libpcre3"
    state: "present"
  environment:
    LD_PRELOAD: /usr/lib/x86_64-linux-gnu/libeatmydata.so
  when: gnt_ver is version('3.0', '==')

